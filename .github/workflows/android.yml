name: Android APK

on:
  push:
    branches: [master, 'claude/**']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - run: cp android/app/build/outputs/apk/release/app-release.apk goal-machine.apk

      - uses: actions/upload-artifact@v4
        with:
          name: goal-machine-apk
          path: goal-machine.apk

      # On master, publish/refresh the "Goal Machine for Android" release so this link always has the newest APK:
      # https://github.com/JoelThornton/JoelThornton.github.io/releases/latest/download/goal-machine.apk
      - name: Publish release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Goal Machine for Android (build ${{ github.run_number }})
          make_latest: true
          files: goal-machine.apk
          body: |
            📲 **Install:** download `goal-machine.apk` below on your Android phone and open it.
            If Android asks, allow installing apps from your browser ("Install unknown apps").

            The app shows the live Goal Machine site, so game updates arrive automatically – you only need a new APK if the app itself changes.
