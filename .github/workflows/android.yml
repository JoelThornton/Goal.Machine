name: Android APK

on:
  push:
    branches: [master, 'claude/**']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Private signing keys come from repository secrets when they are set (see android/store/README.md):
      # UPLOAD_KEYSTORE_B64 / UPLOAD_KEYSTORE_PASSWORD / UPLOAD_KEY_ALIAS for the Google Play bundle, and optionally
      # SIDELOAD_KEYSTORE_B64 / SIDELOAD_KEYSTORE_PASSWORD / SIDELOAD_KEY_ALIAS for the APK.
      - name: Signing keys
        env:
          UPLOAD_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          SIDELOAD_B64: ${{ secrets.SIDELOAD_KEYSTORE_B64 }}
        run: |
          if [ -n "$UPLOAD_B64" ]; then echo "$UPLOAD_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"; echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV";
          else echo "::warning::No UPLOAD_KEYSTORE_B64 secret: the Play bundle is signed with the public repo key (fine for testing, don't upload it)"; fi
          if [ -n "$SIDELOAD_B64" ]; then echo "$SIDELOAD_B64" | base64 -d > "$RUNNER_TEMP/sideload.keystore"; echo "SIDELOAD_KEYSTORE_FILE=$RUNNER_TEMP/sideload.keystore" >> "$GITHUB_ENV"; fi

      - name: Build the APK and the Google Play bundle
        working-directory: android
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          SIDELOAD_KEYSTORE_PASSWORD: ${{ secrets.SIDELOAD_KEYSTORE_PASSWORD }}
          SIDELOAD_KEY_ALIAS: ${{ secrets.SIDELOAD_KEY_ALIAS }}
        run: gradle --no-daemon assembleSideloadRelease bundlePlayRelease

      - run: |
          cp android/app/build/outputs/apk/sideload/release/app-sideload-release.apk goal-machine.apk
          cp android/app/build/outputs/bundle/playRelease/app-play-release.aab goal-machine-play.aab

      - uses: actions/upload-artifact@v4
        with:
          name: goal-machine-apk
          path: goal-machine.apk

      - uses: actions/upload-artifact@v4
        with:
          name: goal-machine-play-bundle
          path: goal-machine-play.aab

      # On master, publish/refresh the "Goal Machine for Android" release so this link always has the newest APK:
      # https://github.com/OpportunisticGames/opportunisticgames.github.io/releases/latest/download/goal-machine.apk
      - name: Publish release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Goal Machine for Android (build ${{ github.run_number }})
          make_latest: true
          files: goal-machine.apk
          body: |
            📲 **Install:** download `goal-machine.apk` below on your Android phone and open it.
            If Android asks, allow installing apps from your browser ("Install unknown apps").

            The app shows the live Goal Machine site, so game updates arrive automatically – you only need a new APK if the app itself changes.
