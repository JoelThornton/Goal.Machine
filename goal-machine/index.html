  <meta name="theme-color" content="#eef2ee">
  <script>
    // apply the saved look before anything paints (see GM.applyTheme)
    (function () {
      var t = 'light';
      try { t = JSON.parse(localStorage.getItem('gm:theme')) || 'light'; } catch (e) { }
      var phone = false;
      try { phone = window.AndroidApp && typeof AndroidApp.nightMode === 'function' ? AndroidApp.nightMode() : window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { }
      var dark = t === 'dark' || t === 'club' || (t === 'auto' && phone);
      if (t === 'club') document.documentElement.className += ' club-theme';
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <meta property="og:title" content="Goal Machine">
  <meta property="og:description" content="Can you build the biggest-scoring Premier League XI?">
